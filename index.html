<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4f46e5">
<title>班主任工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 顶部栏 -->
  <header class="app-header" id="appHeader">
    <div class="header-left">
      <button class="class-switcher" id="classSwitcher" onclick="toggleClassPanel()">
        <span class="class-icon">🎓</span>
        <span class="class-name" id="currentClassName">九年级3班</span>
        <span class="switch-arrow">▼</span>
      </button>
    </div>
    <div class="header-right">
      <div class="datetime" id="headerDateTime"></div>
    </div>
  </header>

  <!-- 班级切换浮层 -->
  <div class="class-panel-overlay" id="classPanelOverlay" onclick="toggleClassPanel()"></div>
  <div class="class-panel" id="classPanel">
    <div class="class-panel-header">
      <h3>切换班级</h3>
      <button onclick="toggleClassPanel()">✕</button>
    </div>
    <div class="class-list" id="classList"></div>
    <div class="class-panel-footer">
      <button class="btn-add-class" onclick="showAddClassForm()">+ 新增班级</button>
    </div>
  </div>

  <!-- 新增班级表单 -->
  <div class="modal" id="addClassModal" style="display:none;">
    <div class="modal-content">
      <h3>新增班级</h3>
      <input type="text" id="newClassName" placeholder="如：九年级5班" class="modal-input">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAddClassForm()">取消</button>
        <button class="btn-confirm" onclick="addClass()">确认</button>
      </div>
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="app-main" id="appMain">
    <!-- 工作台 -->
    <section class="tab-page active" id="tab-dashboard"></section>
    <!-- 学情管理 -->
    <section class="tab-page" id="tab-students"></section>
    <!-- 沟通中心 -->
    <section class="tab-page" id="tab-communication"></section>
    <!-- 班级事务 -->
    <section class="tab-page" id="tab-affairs"></section>
    <!-- 我的课表 -->
    <section class="tab-page" id="tab-schedule"></section>
  </main>

  <!-- 底部Tab栏 -->
  <nav class="app-tabbar">
    <a class="tab-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span class="tab-label">工作台</span>
    </a>
    <a class="tab-item" data-tab="students" onclick="switchTab('students')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span class="tab-label">学情管理</span>
    </a>
    <a class="tab-item" data-tab="communication" onclick="switchTab('communication')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <span class="tab-label">沟通中心</span>
    </a>
    <a class="tab-item" data-tab="affairs" onclick="switchTab('affairs')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <span class="tab-label">班级事务</span>
    </a>
    <a class="tab-item" data-tab="schedule" onclick="switchTab('schedule')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span class="tab-label">我的课表</span>
    </a>
  </nav>

  <!-- 全局浮动按钮 -->
  <button class="fab" id="fab" onclick="onFabClick()" style="display:none;">
    <span>+</span>
  </button>

  <!-- 通用弹窗容器 -->
  <div id="modalContainer"></div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
